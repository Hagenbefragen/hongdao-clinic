<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Die Reise | Hong Dao TCM Clinic</title>
  <meta name="description" content="Hong Dao TCM Clinic in Shenzhen combines traditional Chinese medicine with modern medical diagnostics. Explore our Wudang training, specialized endometriosis program, and voice/sound healing.">
  
  <!-- Fonts & Stylesheet -->
  <link rel="stylesheet" href="style.v2.css">
  <style>
    /* Ensure the main content takes full height without padding for the iframe */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* Prevent double scrollbars on the outer document */
    }
    
    .app-layout {
      height: 100vh;
      display: flex;
    }
    
    .main-content-iframe {
      flex: 1;
      height: 100vh;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .main-content-iframe iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }
    
    /* On mobile, adjust the header offset */
    @media (max-width: 768px) {
      .main-content-iframe {
        padding-top: 60px; /* Account for the mobile header */
        height: calc(100vh - 60px);
      }
    }
  </style>
</head>
<body>

  <!-- App Layout Wrapper -->
  <div class="app-layout">

    <!-- Mobile Header (Visible only on small screens) -->
    <div class="mobile-header">
      <a href="index.html" class="logo-mobile">
        <img src="images/logo_web.png" alt="Hong Dao TCM Clinic" class="logo-img">
      </a>
      <button class="hamburger-menu" id="hamburger-btn" aria-label="Menü öffnen/schließen">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Sidebar Navigation (Desktop) / Fullscreen Menu (Mobile) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <a href="index.html" class="logo">
          <img src="images/logo_web.png" alt="弘道中医 Hong Dao Zhong Yi Logo" class="logo-img">
          <div class="logo-text">
            Hong Dao
            <span class="logo-sub">TCM CLINIC · 弘道中医</span>
          </div>
        </a>
        <ul class="nav-links">
          <li><a href="index.html#home" class="nav-link" data-i18n="nav-home">Startseite</a></li>
          <li><a href="index.html#about" class="nav-link" data-i18n="nav-about">Über uns & Meister</a></li>
          <li><a href="index.html#treatments" class="nav-link" data-i18n="nav-treatments">Behandlungen</a></li>
          <li><a href="index.html#programs" class="nav-link" data-i18n="nav-programs">Programme</a></li>
          <li><a href="reise.html" class="nav-link" data-i18n="nav.reise">Die Reise</a></li>
          <li><a href="index.html#info" class="nav-link" data-i18n="nav-info">Klinik-Info</a></li>
        </ul>
        <div class="nav-controls">
          <div class="lang-switcher">
            <button id="lang-de" class="lang-btn active">DE</button>
            <button id="lang-en" class="lang-btn">EN</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area: iFrame for 1:1 Wix Embed -->
    <main class="main-content-iframe">
        <iframe src="wix_reise_embed.html" title="Original Wix Reise Page"></iframe>
    </main>

  </div>

  <script src="app.v2.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hamburger = document.getElementById('hamburger-btn');
      const sidebar = document.getElementById('sidebar');
      
      if (hamburger && sidebar) {
        hamburger.addEventListener('click', (e) => {
          e.stopPropagation();
          sidebar.classList.toggle('active');
          hamburger.classList.toggle('active');
        });
        
        document.addEventListener('click', (e) => {
          if (!sidebar.contains(e.target) && !hamburger.contains(e.target)) {
            sidebar.classList.remove('active');
            hamburger.classList.remove('active');
          }
        });
      }
    });
  </script>
</body>
</html>
